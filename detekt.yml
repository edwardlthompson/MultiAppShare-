build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

comments:
  active: false

style:
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: false
  WildcardImport:
    active: true

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 10
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable

potential-bugs:
  active: true

performance:
  active: true

empty-blocks:
  active: true

coroutines:
  active: true
