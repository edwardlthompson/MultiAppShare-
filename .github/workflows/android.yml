name: Android CI

on:

  push:

    branches: [ main ]

    tags: [ 'v*' ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

  pull_request:

    branches: [ main ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

  workflow_dispatch:

    inputs:

      release_tag:

        description: 'Existing tag to (re)build and upload signed APK for (e.g. v1.8.0)'

        required: true

        type: string

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: 1704067200
    permissions:

      contents: read

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          persist-credentials: false



      - name: Grant execute permission for gradlew

        run: chmod +x gradlew



      - name: Set up JDK 21

        uses: actions/setup-java@v4

        with:

          java-version: '21'

          distribution: 'temurin'

          cache: gradle



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v4



      - name: File size limits

        run: pwsh -File scripts/check-file-limits.ps1 -Fail



      - name: Detekt

        run: ./gradlew detekt



      - name: Lint

        run: ./gradlew lint



      - name: Unit tests

        run: ./gradlew test



      - name: Kover report

        run: ./gradlew koverXmlReport



      - name: Build Debug APK

        run: ./gradlew assembleDebug



      - name: APK size budget (15 MB)

        run: |

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)

          BYTES=$(stat -c%s "$APK")

          MAX=$((15 * 1024 * 1024))

          echo "APK size: $BYTES bytes (max $MAX)"

          test "$BYTES" -le "$MAX"



  release-apk:

    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:

      contents: write

    env:

      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      RELEASE_KEYSTORE_PATH: release.keystore

      SOURCE_DATE_EPOCH: 1704067200

      GITLAB_API_BASE: ${{ secrets.GITLAB_API_BASE }}

      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}

      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Grant execute permission for gradlew

        run: chmod +x gradlew



      - name: Set up JDK 21

        uses: actions/setup-java@v4

        with:

          java-version: '21'

          distribution: 'temurin'

          cache: gradle



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v4



      - name: Decode release keystore

        run: |

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          ls -la release.keystore



      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Reproducibility smoke (double debug build hash)
        env:
          SOURCE_DATE_EPOCH: 1704067200
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon
          APK1=$(ls -1 app/build/outputs/apk/debug/*.apk | head -n 1)
          HASH1=$(sha256sum "$APK1" | awk '{print $1}')
          ./gradlew :app:clean :app:assembleDebug --no-daemon
          APK2=$(ls -1 app/build/outputs/apk/debug/*.apk | head -n 1)
          HASH2=$(sha256sum "$APK2" | awk '{print $1}')
          echo "Debug APK SHA-256 run1: $HASH1"
          echo "Debug APK SHA-256 run2: $HASH2"
          test "$HASH1" = "$HASH2"

      - name: Upload APK to GitHub Release (clobber)

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          ls -la app/build/outputs/apk/release

          gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/*.apk --clobber



      - name: Upload APK to GitLab Release (optional)
        if: ${{ env.GITLAB_TOKEN != '' && env.GITLAB_PROJECT_ID != '' }}
        run: |
          chmod +x scripts/upload-gitlab-release.sh
          APK_PATH="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
          scripts/upload-gitlab-release.sh "$APK_PATH"
