name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Actions
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Kotlin 2.4.0 exceeds CodeQL's supported compiler range (<2.3.30); java-kotlin
      # build modes fail (github/codeql#21938). This repo is Kotlin-only, so build-mode
      # none also yields zero extractable sources. Scan Actions until upstream supports 2.4.x,
      # then restore: languages: java-kotlin, build-mode: manual, ./gradlew :app:assembleDebug.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
