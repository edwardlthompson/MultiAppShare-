name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Kotlin 2.4.0 exceeds CodeQL's supported compiler range (<2.3.30); build-based
      # modes fail during :compileDebugKotlin. Use none until github/codeql#21938 lands.
      # Java sources are still scanned; Kotlin coverage resumes when upstream supports 2.4.x.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
