name: Bug report
description: Report a bug in Multi App Share
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please avoid pasting backup passphrases or keystore details.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.8.0 (175)
  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: e.g. Pixel 7, Android 14
  - type: dropdown
    id: source
    attributes:
      label: Install source
      options:
        - GitHub Release APK
        - F-Droid
        - Local debug build
        - Other
